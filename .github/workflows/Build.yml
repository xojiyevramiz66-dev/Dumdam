
name: Build Dumdam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dumdam-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Check Gradle wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::error::gradlew is missing from the repository root"
            exit 1
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        if: always() && hashFiles('**/build/outputs/apk/**/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Dumdam-debug-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn
          retention-days: 14
