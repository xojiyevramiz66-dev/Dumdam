
name: Build Dumdam APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dumdam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME}"

          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Show toolchain versions
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Installed NDK versions:"
          ls "$ANDROID_HOME/ndk"
          echo "Installed CMake versions:"
          ls "$ANDROID_HOME/cmake"

      - name: Check project files
        run: |
          set -e

          test -f ./gradlew
          test -f app/src/main/cpp/CMakeLists.txt
          test -d app/src/main/cpp/sd

          chmod +x ./gradlew

          echo "Required project files found."

      - name: Build Debug APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        if: success()
        run: |
          set -e

          APK_PATH="app/build/outputs/apk/debug"

          if ! find "$APK_PATH" -maxdepth 1 -name "*.apk" \
            -type f | grep -q .; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          find "$APK_PATH" -maxdepth 1 -name "*.apk" -type f \
            -exec ls -lh {} \;

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dumdam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Dumdam-build-logs
          path: |
            app/build/outputs/logs/**
            app/.cxx/**
            **/build/CMakeFiles/CMakeOutput.log
            **/build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 7
