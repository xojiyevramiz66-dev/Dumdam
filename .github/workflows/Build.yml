
name: Build Dumdam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dumdam-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Verify project files
        run: |
          test -f gradlew
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          chmod +x gradlew

      - name: Restore missing GGML source files
        run: |
          git clone --depth 1 \
            https://github.com/visitor257/Ponko.git \
            /tmp/ponko-upstream

          SOURCE="/tmp/ponko-upstream/app/src/main/cpp/sd/ggml/src"
          TARGET="app/src/main/cpp/sd/ggml/src"

          test -f "$SOURCE/CMakeLists.txt"
          test -f "$SOURCE/ggml.c"

          mkdir -p "$TARGET"
          cp -a "$SOURCE/." "$TARGET/"

          test -f "$TARGET/CMakeLists.txt"
          test -f "$TARGET/ggml.c"

          echo "GGML source files restored:"
          find "$TARGET" -maxdepth 2 -type f | head -80

      - name: Verify native build configuration
        run: |
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/sd/ggml/CMakeLists.txt
          test -d app/src/main/cpp/sd/ggml/src

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: List APK files
        if: success()
        run: |
          find . -type f -path "*/build/outputs/apk/*.apk" -print

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dumdam-debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: warn
          retention-days: 14
