
name: Build Dumdam APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dumdam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Show toolchain versions
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk"

      - name: Check Gradle wrapper
        run: |
          test -f ./gradlew
          chmod +x ./gradlew

      - name: Check native source files
        run: |
          test -f app/src/main/cpp/CMakeLists.txt
          test -d app/src/main/cpp/sd
          echo "Native C++ source files found."

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dumdam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload native build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Dumdam-build-logs
          path: |
            app/build/outputs/logs/**
            app/.cxx/**
            **/build/CMakeFiles/CMakeOutput.log
            **/build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 7
